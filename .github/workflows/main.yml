
name: Build Lucky3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) {
            $sdkRoot = $env:ANDROID_SDK_ROOT
          }
          if (-not $sdkRoot) {
            throw "Android SDK path was not found."
          }

          $sdkmanager = Get-ChildItem `
            -Path "$sdkRoot\cmdline-tools" `
            -Filter "sdkmanager.bat" `
            -Recurse |
            Select-Object -First 1

          if (-not $sdkmanager) {
            throw "sdkmanager.bat was not found."
          }

          & $sdkmanager.FullName --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK installation failed."
          }
      - name: Set up shared resources
        shell: pwsh
        run: |
          ./tools/setup-shared-resources.ps1

      - name: Build debug APK
        shell: pwsh
        run: |
          ./gradlew.bat assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lucky3D-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
